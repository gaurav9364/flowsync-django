{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow">
            <div class="card-body">

                <h3>Create Task</h3>

                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button class="btn btn-primary">
                        Save Task
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
