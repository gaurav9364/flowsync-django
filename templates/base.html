<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            Team Task Manager
        </a>

        {% if user.is_authenticated %}
        <div class="d-flex gap-2">

            <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

            <a href="{% url 'project_list' %}" class="btn btn-outline-light btn-sm">
                Projects
            </a>

            <a href="{% url 'task_list' %}" class="btn btn-outline-light btn-sm">
                Tasks
            </a>

            <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">
                Logout
            </a>

        </div>
        {% endif %}

    </div>
</nav>

<div class="container mt-5">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
