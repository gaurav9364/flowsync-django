<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowSync</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f7f9fc;
            margin: 0;
            padding: 0;
            color: #1f2937;
        }

        .navbar {
            background: #0f172a;
            padding: 16px 0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .navbar-brand {
            font-size: 22px;
            font-weight: 800;
            color: white !important;
            letter-spacing: -0.5px;
        }

        .nav-btn {
            border-radius: 10px;
            padding: 8px 18px;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        .page-title {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 15px;
        }

        .main-card {
            border: none;
            border-radius: 20px;
            background: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
        }

        .stats-card {
            border: none;
            border-radius: 20px;
            background: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            transition: 0.2s;
        }

        .stats-card:hover {
            transform: translateY(-4px);
        }

        .btn-dark {
            background: #111827;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 600;
        }

        .btn-primary {
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 600;
        }

        .btn-danger {
            border-radius: 10px;
        }

        .badge-high {
            background: #dc2626;
            color: white;
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-medium {
            background: #f59e0b;
            color: white;
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-low {
            background: #16a34a;
            color: white;
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .table thead th {
            border: none;
            color: #6b7280;
            font-size: 14px;
            font-weight: 700;
        }

        .table tbody td {
            vertical-align: middle;
            border-top: 1px solid #f1f5f9;
        }

        input,
        select,
        textarea {
            border-radius: 12px !important;
            padding: 10px !important;
        }

        .main-wrapper {
            padding-top: 50px;
            padding-bottom: 60px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand"
           href="{% url 'dashboard' %}">
            <i class="fa-solid fa-layer-group"></i>
            FlowSync
        </a>

        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2">

            <a href="{% url 'dashboard' %}"
               class="btn btn-outline-light btn-sm nav-btn">
               Dashboard
            </a>

            <a href="{% url 'project_list' %}"
               class="btn btn-outline-light btn-sm nav-btn">
               Projects
            </a>

            <a href="{% url 'team_list' %}"
               class="btn btn-outline-light btn-sm nav-btn">
               Teams
            </a>

            <a href="{% url 'task_list' %}"
               class="btn btn-outline-light btn-sm nav-btn">
               Tasks
            </a>

            <a href="{% url 'notifications' %}"
               class="btn btn-outline-light btn-sm nav-btn">
               <i class="fa-solid fa-bell"></i>
            </a>

            <a href="{% url 'activity' %}"
               class="btn btn-outline-light btn-sm nav-btn">
               Activity
            </a>

            <a href="{% url 'profile' %}"
               class="btn btn-outline-light btn-sm nav-btn">
               Profile
            </a>

            <span class="text-white fw-semibold ms-2">
                {{ user.username }}
            </span>

            <a href="{% url 'logout' %}"
               class="btn btn-danger btn-sm nav-btn">
               <i class="fa-solid fa-right-from-bracket"></i>
            </a>

        </div>
        {% endif %}

    </div>
</nav>

<div class="container main-wrapper">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
