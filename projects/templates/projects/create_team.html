{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card main-card">
            <div class="card-body p-4">

                <h2 class="page-title mb-4">
                    Create Team
                </h2>

                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button class="btn btn-dark">
                        Save Team
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
